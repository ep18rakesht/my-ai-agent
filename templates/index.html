<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My AI Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 780px;
      height: 90vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #6c47d6;
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .chat-header span {
      font-size: 13px;
      opacity: 0.8;
    }

    .clear-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }

    .clear-btn:hover { background: rgba(255,255,255,0.3); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.agent { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: #6c47d6;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.agent .bubble {
      background: #f0f2f5;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .label {
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .thinking .bubble {
      color: #999;
      font-style: italic;
    }

    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 120px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #6c47d6; }

    #send-btn {
      background: #6c47d6;
      color: white;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #5a38c0; }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }

    .welcome {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 40px;
    }

    .welcome h2 { color: #6c47d6; font-size: 22px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="chat-container">

    <div class="chat-header">
      <div>
        <h1>🤖 My AI Agent</h1>
        <span>Powered by Llama 3.2 — running on your laptop</span>
      </div>
      <button class="clear-btn" onclick="clearChat()">Clear chat</button>
    </div>

    <div class="messages" id="messages">
      <div class="welcome">
        <h2>Hello, Rakesh!</h2>
        <p>Your local AI agent is ready. Ask me anything!</p>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="user-input"
        placeholder="Type your message..."
        rows="1"
        onkeydown="handleKey(event)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">&#9658;</button>
    </div>

  </div>

  <script>
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = sender === "user" ? "You" : "AI Agent";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      msg.appendChild(label);
      msg.appendChild(bubble);
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msg;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Show user message
      addMessage(text, "user");
      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;

      // Show thinking indicator
      const thinking = addMessage("Thinking...", "agent thinking");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        messagesDiv.removeChild(thinking);
        addMessage(data.response, "agent");

      } catch (err) {
        messagesDiv.removeChild(thinking);
        addMessage("Sorry, something went wrong. Is Ollama running?", "agent");
      }

      sendBtn.disabled = false;
      input.focus();
    }

    async function clearChat() {
      await fetch("/clear", { method: "POST" });
      messagesDiv.innerHTML = `
        <div class="welcome">
          <h2>Chat cleared!</h2>
          <p>Start a fresh conversation.</p>
        </div>`;
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Auto-resize textarea
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });
  </script>
</body>
</html>
